<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}</style></head><body><div class="r" style="align-items:stretch"><div class="half" style="background:var(--surface-1)"><span class="al-badge al-badge--success">Sì</span><div style="font:var(--text-body-sm)">Fotocamera usata da Messaggi oggi alle 06:58.</div><div style="font:var(--text-body-sm)">Scarica e installa</div><div style="font:var(--text-body-sm)">Nessun aggiornamento disponibile. Ultimo controllo: 06:40.</div></div><div class="half" style="background:var(--surface-1)"><span class="al-badge al-badge--danger">No</span><div style="font:var(--text-body-sm);color:var(--fg-2)">Il tuo telefono è sicuro al 100%!</div><div style="font:var(--text-body-sm);color:var(--fg-2)">CLICCA QUI PER AGGIORNARE ORA</div><div style="font:var(--text-body-sm);color:var(--fg-2)">Ops! Qualcosa è andato storto 😅</div></div></div></body></html>
