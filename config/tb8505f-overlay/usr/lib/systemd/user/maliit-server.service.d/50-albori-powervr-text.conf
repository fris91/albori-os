# Albori OS, Lenovo Tab M8 HD (PowerVR GE8320).
# The on-screen keyboard showed unreadable or missing letters. Qt's
# distance-field glyph cache is unreliable on this GPU, so the keyboard
# renders text with the native glyph cache instead.
[Service]
Environment=QML_DISABLE_DISTANCEFIELD=1
Environment=UC_SHAPE_MIPMAPS=1
