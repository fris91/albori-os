<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}body{background:#2a2c33}</style></head><body><div class="r"><div data-theme="dark" style="position:relative;flex:1;height:200px;border-radius:16px;overflow:hidden"><div class="al-wall al-wall--alba"><span class="al-wall__glow"></span><span class="al-wall__sun"></span><span class="al-wall__ground"></span></div></div><div data-theme="light" style="position:relative;flex:1;height:200px;border-radius:16px;overflow:hidden"><div class="al-wall al-wall--alba"><span class="al-wall__glow"></span><span class="al-wall__sun"></span><span class="al-wall__ground"></span></div></div><div data-theme="dark" style="position:relative;flex:1;height:200px;border-radius:16px;overflow:hidden"><div class="al-wall al-wall--foschia"><span class="al-wall__glow"></span><span class="al-wall__sun"></span><span class="al-wall__ground"></span></div></div><div data-theme="light" style="position:relative;flex:1;height:200px;border-radius:16px;overflow:hidden"><div class="al-wall al-wall--foschia"><span class="al-wall__glow"></span><span class="al-wall__sun"></span><span class="al-wall__ground"></span></div></div></div></body></html>
