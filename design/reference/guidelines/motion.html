<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}.trk{height:16px;border-radius:8px;background:var(--surface-1);position:relative}.trk i{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--accent)}body:hover .trk i{transform:translateX(400px)}</style></head><body><div style="display:grid;grid-template-columns:150px 70px 1fr;gap:10px 14px;align-items:center;font:var(--text-footnote)"><span>Pressione</span><span class="cap">90ms</span><div class="trk"><i style="transition:transform var(--dur-instant) var(--ease-standard)"></i></div><span>Interruttori, chip</span><span class="cap">160ms</span><div class="trk"><i style="transition:transform var(--dur-fast) var(--ease-scatto)"></i></div><span>Centro di controllo, Home</span><span class="cap">240ms</span><div class="trk"><i style="transition:transform var(--dur-base) var(--ease-scatto)"></i></div><span>Apertura e cambio app</span><span class="cap">320ms</span><div class="trk"><i style="transition:transform var(--dur-slow) var(--ease-standard)"></i></div><span>Uscita</span><span class="cap">160ms</span><div class="trk"><i style="transition:transform var(--dur-fast) var(--ease-exit)"></i></div></div><span class="cap">scatto (.2,.9,.25,1) · standard (.3,0,0,1) · exit (.4,0,1,1)</span></body></html>
