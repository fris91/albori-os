<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}</style></head><body><div class="r" style="gap:16px"><div class="sw" style="flex:none"><i style="width:84px;height:64px;border-radius:6px;background:var(--surface-2)"></i><b>xs</b><span>6px</span></div><div class="sw" style="flex:none"><i style="width:84px;height:64px;border-radius:12px;background:var(--surface-2)"></i><b>sm</b><span>12px</span></div><div class="sw" style="flex:none"><i style="width:84px;height:64px;border-radius:16px;background:var(--surface-2)"></i><b>md</b><span>16px</span></div><div class="sw" style="flex:none"><i style="width:84px;height:64px;border-radius:24px;background:var(--surface-2)"></i><b>lg</b><span>24px</span></div><div class="sw" style="flex:none"><i style="width:84px;height:64px;border-radius:32px;background:var(--surface-2)"></i><b>xl</b><span>32px</span></div><div class="sw" style="flex:none"><i style="width:84px;height:64px;border-radius:999px;background:var(--surface-2)"></i><b>pill</b><span>999</span></div><div class="sw" style="flex:none"><i style="width:64px;height:64px;border-radius:28%;background:var(--surface-2)"></i><b>icon</b><span>28%</span></div></div></body></html>
