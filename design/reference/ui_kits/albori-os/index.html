<!-- @dsCard group="Albori OS" viewport="1100x900" name="Prototipo navigabile" subtitle="Lock → Home → app, control centre, settings, store, updates" -->
<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albori OS — Prototipo</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--obsidian-950);min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;padding:24px}.side{width:300px;display:flex;flex-direction:column;gap:20px}.side h1{font:var(--text-display);margin:0}.side p{font:var(--text-body-sm);color:var(--fg-2);margin:0;text-wrap:pretty}.jump{display:flex;flex-wrap:wrap;gap:8px}.lbl{font:var(--text-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3)}</style></head><body>
<div id="root"></div><script type="text/babel" src="os-shell.jsx"></script><script type="text/babel" src="screens-a.jsx"></script><script type="text/babel" src="screens-b.jsx"></script><script type="text/babel" src="screens-c.jsx"></script>
<script type="text/babel">
const { useOS, Phone, DS } = window.AlboriKit; const { Chip, SegmentedControl } = DS;
const JUMP=[['lock','Blocco'],['home','Home'],['drawer','App e ricerca'],['control','Centro di controllo'],['settings','Impostazioni'],['privacy','Privacy'],['personal','Personalizzazione'],['multitask','Multitasking'],['store','Store'],['updates','Aggiornamenti']];
function App(){
  const os=useOS();
  const [scale,setScale]=React.useState(1);
  React.useEffect(()=>{const f=()=>setScale(Math.min(1,(window.innerHeight-72)/844));f();window.addEventListener('resize',f);return()=>window.removeEventListener('resize',f)},[]);
  return (<React.Fragment>
    <div className="side">
      <h1>Albori OS</h1>
      <p>Tocca lo schermo di blocco per entrare. La barra di stato apre il centro di controllo; la barra in basso riporta alla Home.</p>
      <div className="lbl">Vai a</div>
      <div className="jump">{JUMP.map(([k,l])=><Chip key={k} selected={os.s.screen===k} onClick={()=>os.go(k,k==='drawer'?{q:'gi'}:k==='store'?{storeApp:null}:undefined)}>{l}</Chip>)}</div>
      <div className="lbl">Tema</div>
      <SegmentedControl value={os.s.themeMode==='Scuro'?'Scuro':'Chiaro'} onChange={v=>os.set({themeMode:v})} options={[{value:'Scuro',label:'Scuro',icon:'moon'},{value:'Chiaro',label:'Chiaro',icon:'sun'}]}/>
      <div className="lbl">Navigazione</div>
      <SegmentedControl value={os.s.nav} onChange={v=>os.set({nav:v})} options={[{value:'gesture',label:'Gesti'},{value:'buttons',label:'Pulsanti'}]}/>
    </div>
    <div style={{width:390*scale,height:844*scale}}><div style={{transform:'scale('+scale+')',transformOrigin:'0 0'}}><Phone os={os}/></div></div>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
