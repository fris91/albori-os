<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}</style></head><body><div class="r" style="gap:24px;align-items:flex-end"><div class="sw" style="flex:none"><i style="width:48px;height:48px;border-radius:50%;background:var(--surface-2)"></i><b>48</b><span>--touch-min</span></div><div class="sw" style="flex:none"><i style="width:56px;height:56px;border-radius:50%;background:var(--surface-2)"></i><b>56</b><span>--touch</span></div><div class="sw"><i style="height:56px;border-radius:0;box-shadow:inset 0 1px 0 var(--hairline),inset 0 -1px 0 var(--hairline);background:none"></i><b>Riga elenco</b><span>min-height 56 · margin 16</span></div></div></body></html>
