<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}</style></head><body><div class="r" style="align-items:flex-end;gap:16px"><div class="sw" style="flex:none;align-items:center"><i style="width:4px;height:4px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>4</b><span>space-1</span></div><div class="sw" style="flex:none;align-items:center"><i style="width:8px;height:8px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>8</b><span>space-2</span></div><div class="sw" style="flex:none;align-items:center"><i style="width:12px;height:12px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>12</b><span>space-3</span></div><div class="sw" style="flex:none;align-items:center"><i style="width:16px;height:16px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>16</b><span>space-4</span></div><div class="sw" style="flex:none;align-items:center"><i style="width:24px;height:24px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>24</b><span>space-5</span></div><div class="sw" style="flex:none;align-items:center"><i style="width:32px;height:32px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>32</b><span>space-6</span></div><div class="sw" style="flex:none;align-items:center"><i style="width:48px;height:48px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>48</b><span>space-7</span></div><div class="sw" style="flex:none;align-items:center"><i style="width:64px;height:64px;border-radius:2px;background:var(--accent);box-shadow:none"></i><b>64</b><span>space-8</span></div></div></body></html>
