<!-- @dsCard group="Colors" viewport="700x150" name="Semantici" subtitle="Status colours — always paired with an icon or word" -->
<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}</style></head><body><div class="r"><div style="flex:1;padding:14px;border-radius:12px;background:var(--success-soft);color:var(--success);font:var(--text-label)">Aggiornato<div class="cap" style="color:inherit;opacity:.8;margin-top:4px">--success</div></div><div style="flex:1;padding:14px;border-radius:12px;background:var(--warning-soft);color:var(--warning);font:var(--text-label)">Attenzione<div class="cap" style="color:inherit;opacity:.8;margin-top:4px">--warning</div></div><div style="flex:1;padding:14px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font:var(--text-label)">Errore<div class="cap" style="color:inherit;opacity:.8;margin-top:4px">--danger</div></div><div style="flex:1;padding:14px;border-radius:12px;background:var(--info-soft);color:var(--info);font:var(--text-label)">Informazione<div class="cap" style="color:inherit;opacity:.8;margin-top:4px">--info</div></div></div></body></html>
