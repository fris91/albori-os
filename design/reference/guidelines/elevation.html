<!-- @dsCard group="Spacing" viewport="700x180" name="Livelli e vetro" subtitle="Hairlines instead of shadows; blur only over wallpaper" -->
<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;justify-content:center}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:var(--text-mono);font-size:11px;color:var(--fg-2)}.sw i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}.sw b{font:var(--text-label);color:var(--fg-1)}.cap{font:var(--text-mono);font-size:11px;color:var(--fg-3)}.half{flex:1;padding:16px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}</style></head><body><div class="r" style="gap:16px;position:relative;padding:20px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--wall-sky-mid),var(--wall-horizon))"><div style="flex:1;height:84px;border-radius:24px;padding:14px 16px;background:var(--surface-1);box-shadow:var(--shadow-1)"><div style="font:var(--text-label)">Hairline</div><div class="cap" style="color:var(--fg-2)">--shadow-1</div></div><div style="flex:1;height:84px;border-radius:24px;padding:14px 16px;background:var(--surface-1);box-shadow:var(--shadow-2)"><div style="font:var(--text-label)">Sollevato</div><div class="cap" style="color:var(--fg-2)">--shadow-2 · sheets</div></div><div style="flex:1;height:84px;border-radius:24px;padding:14px 16px;background:var(--surface-glass);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--hairline)"><div style="font:var(--text-label)">Vetro</div><div class="cap" style="color:var(--fg-2)">--surface-glass + blur 24</div></div></div></body></html>
